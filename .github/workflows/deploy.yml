name: Build and Deploy

on:
  push:
    branches: [source]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        run: npm run build -- --prerender-all

      - name: Prepare publish directory
        run: |
          mkdir -p "$RUNNER_TEMP/publish"
          cp -R dist/client/. "$RUNNER_TEMP/publish/"
          cp dist/server/prerendered-routes/*.html dist/server/prerendered-routes/*.rsc "$RUNNER_TEMP/publish/"
          touch "$RUNNER_TEMP/publish/.nojekyll"

      - name: Publish to master branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin master
          git switch --detach origin/master
          find . -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
          cp -R "$RUNNER_TEMP/publish/." .
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to publish."
          else
            git commit -m "Deploy: $GITHUB_SHA"
            git push origin HEAD:master
          fi
